name: dtek

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: dtek
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: sudo apt-get install -y -q fonts-dejavu-core
      - run: pip install -r requirements.txt
      - run: python -u p.py --once
        env:
          PYTHONIOENCODING: utf-8
          WORKER_URL: ${{ secrets.WORKER_URL }}
          UPLOAD_TOKEN: ${{ secrets.UPLOAD_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs
          path: |
            logs/monitor.log
            debug/
          retention-days: 3
      # cron у GitHub срабатывает нерегулярно, поэтому каждый запуск ставит в очередь следующий
      - name: Запустить следующий проход
        if: always()
        run: |
          sleep 120
          gh workflow run dtek.yml --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
